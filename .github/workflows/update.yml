name: Perbarui kalender
on:
  schedule:
    - cron: "0 1 1 * *"   # tiap tanggal 1 pukul 01.00 UTC
  push:
    paths: ["kemenag.json", "buat_kalender.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python buat_kalender.py 2026 2035
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Perbarui kalender" && git push)
